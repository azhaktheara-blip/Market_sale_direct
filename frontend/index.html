<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316a34a'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Standard SEO -->
    <title>FarmerDirect | Direct Farm-to-Table Agricultural Marketplace</title>
    <meta name="description" content="Discover organic vegetables, award-winning Jasmine rice, and sun-ripened tropical fruits harvested daily by verified family farms across Cambodia. Zero middleman markup." />
    <meta name="keywords" content="farmers market, organic produce, farm direct, Cambodia organic, fresh vegetables, Jasmine rice, Kampot pepper, sustainable farming" />
    <meta name="theme-color" content="#1b4d3e" />
    <link rel="canonical" href="https://market-sale-direct.vercel.app/" />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://market-sale-direct.vercel.app/" />
    <meta property="og:title" content="FarmerDirect — Direct Farm-to-Table Marketplace" />
    <meta property="og:description" content="Connecting conscious buyers with authentic local Cambodian growers. 100% provenance transparency and fair prices." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1610348725531-843dff563e2c?auto=format&fit=crop&w=1200&h=630&q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://market-sale-direct.vercel.app/" />
    <meta name="twitter:title" content="FarmerDirect — Direct Farm-to-Table Marketplace" />
    <meta name="twitter:description" content="Connecting conscious buyers with authentic local Cambodian growers. 100% provenance transparency and fair prices." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1610348725531-843dff563e2c?auto=format&fit=crop&w=1200&h=630&q=80" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FarmerDirect",
      "url": "https://market-sale-direct.vercel.app/",
      "description": "Discover organic vegetables and fresh produce directly from verified family farms.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://market-sale-direct.vercel.app/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Fonts: English & Khmer -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Koulen&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-50 text-stone-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
