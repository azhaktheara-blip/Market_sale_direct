version: '3.8'

networks:
  public_net:
    driver: bridge
  internal_net:
    internal: false
    driver: bridge

services:
  # 1. PostgreSQL Database (Internal only, not exposed to host)
  db:
    image: postgres:16-alpine
    container_name: farmer_direct_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmer_direct_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Celery Broker (Internal only)
  redis:
    image: redis:7-alpine
    container_name: farmer_direct_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Django REST Framework Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmer_direct_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers $${WEB_CONCURRENCY:-3} --threads $${GUNICORN_THREADS:-2}"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - SECRET_KEY=${SECRET_KEY:?Django SECRET_KEY must be set in environment}
      - DEBUG=${DEBUG:-False}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-2}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-farmer_direct_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - internal_net
      - public_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Async Task Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmer_direct_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - media_volume:/app/media
    environment:
      - SECRET_KEY=${SECRET_KEY:?Django SECRET_KEY must be set in environment}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-farmer_direct_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - internal_net
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # 5. Celery Scheduled Beat
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmer_direct_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    environment:
      - SECRET_KEY=${SECRET_KEY:?Django SECRET_KEY must be set in environment}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-farmer_direct_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - internal_net
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # 6. React + Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmer_direct_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - public_net
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
